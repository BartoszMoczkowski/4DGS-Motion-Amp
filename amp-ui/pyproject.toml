[project]
name = "amp-ui"
version = "0.1.0"
description = "Standalone Streamlit UI + benchmark harness for motion-amplified 4DGS rendering, plus USB camera recorder"
requires-python = "==3.12.12"
dependencies = [
    "4dgs-core",
    "streamlit>=1.38",
    "av>=12.0",
    "pandas>=2.0",
    "opencv-python>=5.0.0.93",
]

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["amp_ui*"]

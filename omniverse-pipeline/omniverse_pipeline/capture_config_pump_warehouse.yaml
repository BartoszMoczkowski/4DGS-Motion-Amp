# Capture config for the WAREHOUSE pump scene (omni_capture.py, Isaac Sim 6.0).
# Target: omniverse-pipeline/data/scenes/pump_warehouse.usd — composed scene (see
# .claude_notes/NOTES_warehouse_scene.md): the 107-part animated pump (as /World/pump,
# renamed from CONJUNTO_BOMBAS) inside the physAI_start factory hall (/World/Factory).
#
# Run:  <isaac-python> omni_capture.py --config capture_config_pump_warehouse.yaml
# Then: python omni_to_4dgs.py --capture Q:/Omniverse/renders/capture_pump_warehouse --out . --name pump_warehouse01
#
# Scene facts (measured): Z-up, metersPerUnit 0.01 (cm). Pump bbox (scale 0.2 placement):
# [-130,-437,0.4]..[109,71,408] cm -> center ~(-11,-183,204), radius ~290 cm.
# Factory hall: [-1696,-3048,0]..[1914,3046,1276] cm, 18 sphere ceiling lights.

app:
  headless: true

scene:
  usd_path: "C:/Users/barte/Code/PythonScripts/4DGS-Motion-Amp/omniverse-pipeline/data/scenes/pump_warehouse.usd"
  subject_prim: "/World/pump"            # rig bbox + init point cloud are pump-only (factory excluded)
  # Label each of the 107 parts (frame_base + part_001..106) as its own instance =>
  # instance/semantic masks are the GT. Factory geometry gets no labels (background).
  semantic_roots: ["/World/pump"]

rig:
  layout: dome                           # dome gives good top+side coverage of a tall machine
  n_cameras: 10                          # 8-12; override with --n-cameras
  radius_scale: 2.5                      # cameras ~7-8 m out (2.5 * ~2.9 m), well inside the hall
  n_rings: 3
  min_elev_deg: 15
  max_elev_deg: 75
  # world_up auto-detected as Z from the stage.

capture:
  width: 1600
  height: 900
  vfov_deg: 45
  num_frames: 60                         # == timeline length, so 1 capture per authored keyframe
  rt_subframes: 16                       # path-trace samples/frame (raise for less noise)
  near: 15.0                             # ~0.05 * radius (cm)
  far: 5000.0                            # must reach the factory walls: camera ~7 m out,
                                         # far wall up to ~37 m away -> 50 m headroom

output:
  capture_dir: "Q:/Omniverse/renders/capture_pump_warehouse"
  instance_segmentation: true
  semantic_segmentation: true
  num_init_points: 100000                # mesh has ~104k verts; ~100k init points is plenty

lighting:                                # a headless render is black without a light
  enabled: true
  force: false                           # factory ships 18 sphere lights -> our dome/distant are
                                         # skipped; the factory hall itself is the background.
                                         # Set force: true to add our key light on top if the
                                         # factory lighting is too dim.
  add_dome: true
  dome_intensity: 1000.0
  dome_texture: generate                 # dark grid backdrop -> contrast + features for 4DGS
  bg_base: [6, 7, 11]                    # near-black background base color (0-255)
  bg_line: [28, 32, 44]                  # faint grid line color
  bg_dot: [48, 54, 70]                   # brighter dots at grid intersections
  bg_step: 64                            # grid spacing in texture pixels
  add_distant: true
  distant_intensity: 4000.0              # key light (raised: dark dome gives little fill)
  distant_elev_deg: 45.0
  distant_azim_deg: -45.0

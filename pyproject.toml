[project]
name = "4dgs-motion-amp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.12.12"
dependencies = [
    "argparse>=1.4.0",
    "ninja>=1.13.0",
    "open3d>=0.19.0",
    "pyquaternion>=0.9.9",
    "pyyaml>=6.0.3",
    "tensorboardx>=2.6.5",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "tqdm>=4.67.3",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true  # Prevents uv from using this index for non-PyTorch packages

# 2. Bind the PyTorch packages directly to that index
[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]
torchvision = [{ index = "pytorch-cu126" }]
torchaudio = [{ index = "pytorch-cu126" }]

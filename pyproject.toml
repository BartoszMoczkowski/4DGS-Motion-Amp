[project]
name = "4dgs-motion-amp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.12.12"
dependencies = [
    "argparse>=1.4.0",
    "diff-gaussian-rasterization",
    "imageio[ffmpeg]>=2.37.3",
    "lpips>=0.1.4",
    "matplotlib>=3.8",
    "mmcv",
    "ninja>=1.13.0",
    "open3d>=0.19.0",
    "opencv-python>=5.0.0.93",
    "plyfile>=1.1.4",
    "pyquaternion>=0.9.9",
    "pyyaml>=6.0.3",
    "scipy>=1.11",
    "simple-knn",
    "tensorboardx>=2.6.5",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "tqdm>=4.67.3",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true  # Prevents uv from using this index for non-PyTorch packages

# 2. Bind the PyTorch packages directly to that index
[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]
torchvision = [{ index = "pytorch-cu126" }]
torchaudio = [{ index = "pytorch-cu126" }]
depth-diff-gaussian-rasterization = { workspace = true, editable = true }
diff-gaussian-rasterization = { workspace = true, editable = true }
simple-knn = { workspace = true, editable = true }
mmcv = { url = "https://download.openmmlab.com/mmcv/dist/cu121/torch2.4.0/mmcv-2.2.0-cp312-cp312-manylinux1_x86_64.whl" }

[tool.uv.workspace]
members = [
    "submodules/depth-diff-gaussian-rasterization",
    "submodules/simple-knn",
]


[tool.uv]
no-build-isolation-package = ["diff-gaussian-rasterization","simple-knn"]

[project]
name = "camera-sync-analyzer"
version = "0.1.0"
description = "Post-processing analyzer for QR-based camera synchronization"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.9.0",
    "numpy>=1.26.0",
    "pyzbar>=0.1.9",
    "scipy>=1.12.0",
]

[project.scripts]
sync-analyzer = "sync_analyzer.analyze:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sync_analyzer"]

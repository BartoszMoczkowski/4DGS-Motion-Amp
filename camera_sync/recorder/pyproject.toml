[project]
name = "camera-sync-recorder"
version = "0.1.0"
description = "FFmpeg-based multi-camera RTSP recorder with sidecar manifest"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
recorder = "recorder.record:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["recorder"]

[project]
name = "camera-sync-display"
version = "0.1.0"
description = "Full-screen sync display with QR-encoded timestamps and ArUco markers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pygame>=2.5.0",
    "qrcode[pil]>=7.4.2",
    "opencv-python>=4.9.0",
    "numpy>=1.26.0",
]

[project.scripts]
sync-display = "sync_display.display:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sync_display"]

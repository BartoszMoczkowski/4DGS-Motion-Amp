[project]
name = "pipeline"
version = "0.1.0"
description = "4DGS motion-amp orchestrator — Layer 1 DAG execution engine"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "docker>=7.1",
    "pynvml>=11.5",
    # T07: the CPU stages call already-verified repo scripts in-process (omni_to_4dgs.py,
    # motion_seg/segment_rigid.py, motion_seg/evaluate_segmentation.py), which need numpy/scipy
    # (cKDTree, connected_components, linear_sum_assignment) and Pillow (frame re-encoding).
    "numpy>=1.24",
    "scipy>=1.10",
    "Pillow>=10.0",
    # T12: cross-platform system-RAM query (pynvml above already covers VRAM).
    "psutil>=5.9",
]

[project.optional-dependencies]
# T13: Layer 2 (mcp_server/) — the HTTP/SSE MCP transport + auth. Kept as an opt-in extra, not a
# base dependency, so importing/testing `pipeline` (Layer 1) alone never needs to pull in `mcp`
# (and its starlette/uvicorn/httpx-sse/... transitive deps) at all.
mcp = ["mcp>=1.28"]

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pipeline*", "mcp_server*"]

[tool.setuptools.package-data]
pipeline = ["config/presets/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# Scene preset for the synthetic animated pump (CONJUNTO_BOMBAS_animated.usd).
# Migrated from: omniverse_pipeline/capture_config_pump.yaml, arguments/multipleview/pump01.py,
# train_pump.sh's default NAME/PORT. See MIGRATION.md for the field-by-field mapping and
# tests/test_config.py for the round-trip check against the two legacy files.
extends: base
name: pump01

capture:
  headless: true
  scene:
    usd_path: "Q:/Omniverse/assets/pump_radnom/CONJUNTO_BOMBAS_animated.usd"
    subject_prim: null # whole stage IS the pump; rig sizes to its bbox
    semantic_roots: ["/World/CONJUNTO_BOMBAS"]
  rig:
    layout: dome # dome gives good top+side coverage of a tall machine
    n_cameras: 10
    radius_scale: 2.5 # cameras ~43 m out (2.5 * 17.4 m measured radius)
    n_rings: 3
    min_elev_deg: 15
    max_elev_deg: 75
  capture:
    width: 1600
    height: 900
    vfov_deg: 45
    num_frames: 60 # == timeline length, so 1 capture per authored keyframe
    rt_subframes: 16 # path-trace samples/frame
    near: 90.0 # ~0.05 * radius (cm)
    far: 7000.0 # ~4 * radius (cm)
  output:
    capture_dir: "Q:/Omniverse/renders/capture_pump"
    instance_segmentation: true
    semantic_segmentation: true
    num_init_points: 100000 # mesh has ~104k verts; ~100k init points is plenty
  lighting:
    enabled: true
    force: false
    add_dome: true
    dome_intensity: 1000.0
    dome_texture: generate # dark grid backdrop -> contrast + features for 4DGS
    bg_base: [6, 7, 11]
    bg_line: [28, 32, 44]
    bg_dot: [48, 54, 70]
    bg_step: 64
    add_distant: true
    distant_intensity: 4000.0 # key light (raised: dark dome gives little fill)
    distant_elev_deg: 45.0
    distant_azim_deg: -45.0

convert:
  name: pump01
  near: 0.1
  far: 1000.0
  target_radius: 4.0

model:
  source_path: "data/multipleview/pump01"
  model_path: "output/multipleview/pump01"

train:
  port: 6017 # train_pump.sh default PORT
  expname: "multipleview/pump01"

optim:
  # Only diff from base (arguments/multipleview/default.py): base's default 3000 collides
  # exactly with coarse_iterations, resetting opacity to ~0 right as the fine-stage deformation
  # network engages for the first time -> reliably nan's the loss. See pump01.py's comment.
  opacity_reset_interval: 60000

prep_split:
  group: CONJUNTO_BOMBAS

prep_motion:
  group: CONJUNTO_BOMBAS
  num_frames: 60
  fps: 24.0
  exclude: ["frame_base"]

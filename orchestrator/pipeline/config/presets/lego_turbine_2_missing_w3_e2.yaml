# W3 (E2) — Continuous normalized soft loss weighting on E1 timing baseline
# Extends lego_turbine_2_missing_w1_e1a with continuous, floor-bounded, unit-mean soft loss weights.
# Gating: no hard masks, no ROI voxel grid, pure HexPlane deformation everywhere.
extends: lego_turbine_2_missing_w1_e1a
name: lego_turbine_2_missing_w3_e2

model:
  model_path: "output/multipleview/lego_turbine_2_missing_w3_e2"

train:
  port: 6019
  expname: "multipleview/lego_turbine_2_missing_w3_e2"

optim:
  use_motion_mask: true
  normalize_motion_mask: true
  motion_mask_max: 15.0


extends: real_capture
name: lego_turbine_base

model:
  source_path: "data/multipleview/lego_turbine_base"
  model_path: "output/multipleview/lego_turbine_base"

train:
  port: 6017
  expname: "multipleview/lego_turbine_base"

hidden:
  regularizer_anneal_iter: 3000
  time_smoothness_weight_final: 0.0001
  l1_time_planes_final: 0.0

optim:
  use_motion_mask: true
  motion_mask_max: 50.0
  coarse_iterations: 500


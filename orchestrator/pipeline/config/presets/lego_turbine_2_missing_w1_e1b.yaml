# W1 (E1b) — Guarded learnable per-camera offsets on native-4DGS baseline
# Extends lego_turbine_2_missing_w1_e1a, differing ONLY in learnable_camera_offsets: true.
# cam01 is anchored by construction; non-anchor cameras are regularized toward the sidecar
# initialization with a quadratic prior (sigma = 5 ms, lambda = 0.01) after freeze_iter = 3000.
extends: lego_turbine_2_missing_w1_e1a
name: lego_turbine_2_missing_w1_e1b

model:
  source_path: "data/multipleview/lego_turbine_2_missing"
  model_path: "output/multipleview/lego_turbine_2_missing_w1_e1b"
  learnable_camera_offsets: true

train:
  port: 6017
  expname: "multipleview/lego_turbine_2_missing_w1_e1b"

optim:
  learnable_camera_offsets: true


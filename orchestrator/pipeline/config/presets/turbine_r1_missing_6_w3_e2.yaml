# W3 (E2) — Continuous normalized soft loss weighting on E1b timing baseline
# Extends turbine_r1_missing_6_w1_e1b with continuous, floor-bounded, sum-w normalized soft loss weights.
# Gating: no hard masks, no ROI voxel grid, pure HexPlane deformation everywhere.
# Inherits guarded learnable offsets (cam01 anchor, sigma=5ms prior) and fixed densification bounds (max_points=90k).
extends: turbine_r1_missing_6_w1_e1b
name: turbine_r1_missing_6_w3_e2

model:
  model_path: "output/multipleview/turbine_r1_missing_6_w3_e2"

train:
  port: 6025
  expname: "multipleview/turbine_r1_missing_6_w3_e2"

optim:
  use_motion_mask: true
  normalize_motion_mask: true
  motion_mask_max: 15.0


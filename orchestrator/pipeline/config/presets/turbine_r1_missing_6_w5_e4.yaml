# W5 (E4) — Reversible outer-loop component split and merge on W4 (E3) baseline
# Validates structural changes (K -> K+1 or K -> K-1) on held-out evidence with exact rollback.
extends: turbine_r1_missing_6_w4_e3
name: turbine_r1_missing_6_w5_e4

model:
  model_path: "output/multipleview/turbine_r1_missing_6_w5_e4"

train:
  port: 6027
  expname: "multipleview/turbine_r1_missing_6_w5_e4"

optim:
  use_split_merge: true
  split_merge_start_iter: 1500
  split_merge_interval: 1000
  split_merge_max_components: 4
  split_merge_min_support: 10.0
  split_merge_eval_window: 300
  split_merge_min_improvement: 0.05
  split_merge_cooldown_iters: 2000


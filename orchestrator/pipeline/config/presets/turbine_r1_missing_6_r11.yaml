# Corrective r11 stack for turbine_r1_missing_6 — preflight-green configuration
# (T38/r14 synthetic preflight, 2026-10-27, see docs/turbine_wobble_r9_attempt_report.md §6.1).
# Base preset already carries the Phase-1 stack (annealed regularizers, motion-mask
# loss, coarse 500). This adds the ROI-gated Fourier-rigid head at the corrected
# 5.691 Hz with fixed sidecar offsets, learnable offsets OFF, trajectory loss OFF,
# and the r14 static-background freeze that passed the synthetic preflight.
#
# Prerequisites (already prepared 2026-10-28):
#   - motion masks regenerated at 4.5–7 Hz (stale 6–9 Hz set kept in
#     motion_masks_stale_6-9Hz/)
#   - roi_voxels.npz derived with 4-camera minimum voting (22.8% selectivity;
#     this scene's wobble is stronger so 2–3 votes over-select)
extends: turbine_r1_missing_6
name: turbine_r1_missing_6_r11

optim:
  use_camera_offsets: true
  learnable_camera_offsets: false
  lambda_trajectory: 0.0
  use_fourier_rigid_head: true
  fourier_head_lr: 0.001
  fourier_head_freeze_iter: 500
  fourier_head_frequency_hz: 5.691
  fourier_head_learn_frequency: false
  fourier_head_num_harmonics: 3
  fourier_head_pure_rigid: true
  fourier_head_static_background: true
  use_roi_voxels: true
